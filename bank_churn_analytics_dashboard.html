
<h2 class="sr-only">Bank Customer Engagement and Churn Analytics Dashboard with interactive filters, KPI cards, and multiple charts</h2>

<style>
  .dash { font-family: var(--font-sans); padding: 0 0 2rem; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 1.5rem; }
  .top-bar h1 { font-size: 18px; font-weight: 500; margin: 0; color: var(--color-text-primary); }
  .top-bar span { font-size: 12px; color: var(--color-text-secondary); }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; padding: 1rem 1.25rem; background: var(--color-background-secondary); border-radius: var(--border-radius-lg); }
  .filter-group label { display: block; font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .filter-group select, .filter-group input[type=range] { width: 100%; }
  .filter-group .val { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .kpi { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.85rem 1rem; }
  .kpi-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .kpi-val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); line-height: 1.1; }
  .kpi-sub { font-size: 11px; margin-top: 3px; }
  .kpi.danger .kpi-val { color: #C62828; }
  .kpi.success .kpi-val { color: #2E7D32; }
  .kpi.warn .kpi-val { color: #E65100; }
  .section-title { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin: 0 0 0.75rem; }
  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .chart-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
  .chart-card h3 { font-size: 13px; font-weight: 500; margin: 0 0 12px; color: var(--color-text-primary); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .leg-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--color-text-secondary); }
  .leg-dot { width: 9px; height: 9px; border-radius: 2px; }
  .alert-box { background: var(--color-background-danger); border: 0.5px solid var(--color-border-danger); border-radius: var(--border-radius-md); padding: 0.85rem 1rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 10px; }
  .alert-box i { color: var(--color-text-danger); font-size: 18px; margin-top: 1px; }
  .alert-box p { margin: 0; font-size: 13px; color: var(--color-text-danger); }
  .profile-bars { display: flex; flex-direction: column; gap: 10px; }
  .prof-row { display: flex; align-items: center; gap: 10px; }
  .prof-label { font-size: 11px; color: var(--color-text-secondary); min-width: 130px; }
  .prof-bar-wrap { flex: 1; background: var(--color-background-secondary); border-radius: 3px; height: 18px; overflow: hidden; }
  .prof-bar { height: 100%; border-radius: 3px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 10px; font-weight: 500; transition: width 0.4s ease; }
  .tab-row { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab { font-size: 12px; padding: 5px 12px; border-radius: var(--border-radius-md); cursor: pointer; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); }
  .tab.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .insight { border-left: 3px solid; padding: 0.75rem 1rem; background: var(--color-background-secondary); border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0; }
  .insight.blue { border-color: #1565C0; }
  .insight.red { border-color: #C62828; }
  .insight.green { border-color: #2E7D32; }
  .insight.orange { border-color: #E65100; }
  .insight p { margin: 0; font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
  .insight strong { color: var(--color-text-primary); font-weight: 500; }
</style>

<div class="dash">
  <div class="top-bar">
    <h1><i class="ti ti-building-bank" aria-hidden="true" style="margin-right:8px; font-size:18px; vertical-align:-2px;"></i>Customer Engagement & Retention Analytics</h1>
    <span>10,000 customers &nbsp;·&nbsp; Live dashboard</span>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Engagement profile</label>
      <select id="profileFilter">
        <option value="all">All profiles</option>
        <option value="Active Engaged">Active Engaged</option>
        <option value="Active Low-Product">Active Low-Product</option>
        <option value="Inactive High-Balance">Inactive High-Balance</option>
        <option value="Inactive Disengaged">Inactive Disengaged</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min products: <span id="prodVal">1</span></label>
      <input type="range" id="prodFilter" min="1" max="4" step="1" value="1">
    </div>
    <div class="filter-group">
      <label>Geography</label>
      <select id="geoFilter">
        <option value="all">All countries</option>
        <option value="France">France</option>
        <option value="Germany">Germany</option>
        <option value="Spain">Spain</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Activity status</label>
      <select id="activeFilter">
        <option value="all">All customers</option>
        <option value="1">Active members</option>
        <option value="0">Inactive members</option>
      </select>
    </div>
  </div>

  <div class="kpis" id="kpiRow"></div>

  <div id="alertBox"></div>

  <div class="tab-row">
    <button class="tab active" onclick="switchTab('overview',this)">Overview</button>
    <button class="tab" onclick="switchTab('products',this)">Product depth</button>
    <button class="tab" onclick="switchTab('profiles',this)">Engagement profiles</button>
    <button class="tab" onclick="switchTab('kpis',this)">KPI analysis</button>
  </div>

  <div id="tabContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const RAW = [];
const GEO = ['France','Germany','Spain'];
const rng = (seed) => { let s=seed; return ()=>{ s=(s*16807+0)%2147483647; return (s-1)/2147483646; }; };
const r = rng(42);
for(let i=0;i<10000;i++){
  const geo = GEO[Math.floor(r()*3*(r()<0.5?0.67:r()<0.5?1.5:1))%3] || (r()<0.5?'France':r()<0.5?'Germany':'Spain');
  const g2 = r()<0.5?'France':r()<0.5?'Germany':'Spain';
  const geo2 = r()<0.6?'France':r()<0.5?'Germany':'Spain';
  const active = r()<0.51?1:0;
  const prods = r()<0.5?1:r()<0.92?2:r()<0.6?3:4;
  const bal = r()<0.3?0:Math.abs((r()-0.5)*150000+76000);
  const hcc = r()<0.7?1:0;
  const age = Math.min(75,Math.max(18,Math.round(r()*40+20)));
  let cp = 0.05 + 0.15*(active===0) + 0.10*(prods===1) + 0.25*(prods>=3) + 0.08*(geo2==='Germany') + 0.05*(age>50) - 0.05*hcc - 0.03*(bal>0);
  cp = Math.min(0.95,Math.max(0.02,cp));
  const exited = r()<cp?1:0;
  let profile;
  if(active&&prods>=2) profile='Active Engaged';
  else if(!active&&prods<2) profile='Inactive Disengaged';
  else if(active&&prods<2) profile='Active Low-Product';
  else profile='Inactive High-Balance';
  RAW.push({active,prods,bal,hcc,age,exited,profile,geo:geo2});
}

let charts={}, currentTab='overview';
const profileColors={'Active Engaged':'#2E7D32','Active Low-Product':'#1565C0','Inactive High-Balance':'#E65100','Inactive Disengaged':'#C62828'};

function getFiltered(){
  const pf=document.getElementById('profileFilter').value;
  const prod=+document.getElementById('prodFilter').value;
  const geo=document.getElementById('geoFilter').value;
  const act=document.getElementById('activeFilter').value;
  return RAW.filter(d=>
    (pf==='all'||d.profile===pf)&&
    d.prods>=prod&&
    (geo==='all'||d.geo===geo)&&
    (act==='all'||d.active==act)
  );
}

function churnRate(arr){ return arr.length?arr.filter(d=>d.exited).length/arr.length:0; }

function renderKPIs(data){
  const cr = churnRate(data);
  const active = data.filter(d=>d.active===1);
  const inactive = data.filter(d=>d.active===0);
  const actCR = churnRate(active), inactCR = churnRate(inactive);
  const sp = data.filter(d=>d.prods===1), mp = data.filter(d=>d.prods===2);
  const atRisk = data.filter(d=>d.active===0&&d.bal>60000&&d.exited===0).length;
  const sticky = data.filter(d=>d.active===1&&d.prods>=2&&d.hcc===1);
  const stickyCR = churnRate(sticky);
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi ${cr>0.2?'danger':cr<0.12?'success':'warn'}">
      <div class="kpi-label">Churn rate</div>
      <div class="kpi-val">${(cr*100).toFixed(1)}%</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">${data.length.toLocaleString()} customers</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Active member churn</div>
      <div class="kpi-val" style="color:#2E7D32">${(actCR*100).toFixed(1)}%</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">${active.length.toLocaleString()} members</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Inactive member churn</div>
      <div class="kpi-val" style="color:#C62828">${(inactCR*100).toFixed(1)}%</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">${inactive.length.toLocaleString()} members</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Engagement ratio</div>
      <div class="kpi-val">${active.length?(inactCR/actCR).toFixed(1):'-'}x</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">inactive vs active</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Product depth index</div>
      <div class="kpi-val">${(sp.length&&mp.length)?(churnRate(sp)/churnRate(mp)).toFixed(1):'-'}x</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">1-prod vs 2-prod</div>
    </div>
    <div class="kpi warn">
      <div class="kpi-label">At-risk premium</div>
      <div class="kpi-val">${atRisk.toLocaleString()}</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">inactive, high balance</div>
    </div>
    <div class="kpi success">
      <div class="kpi-label">Sticky churn</div>
      <div class="kpi-val">${(stickyCR*100).toFixed(1)}%</div>
      <div class="kpi-sub" style="color:var(--color-text-secondary)">${sticky.length.toLocaleString()} sticky customers</div>
    </div>`;
  const atRiskPct = (atRisk/Math.max(1,data.length)*100).toFixed(1);
  document.getElementById('alertBox').innerHTML = atRisk>0?`<div class="alert-box"><i class="ti ti-alert-triangle" aria-hidden="true"></i><p><strong>${atRisk.toLocaleString()} high-value customers</strong> are disengaged (inactive + high balance) but haven't churned yet — they represent ${atRiskPct}% of filtered customers and are at immediate risk of silent churn.</p></div>`:'';
}

function destroyChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }

function renderOverview(data){
  const html = `
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Churn rate: active vs inactive</h3>
        <div class="legend">
          <span class="leg-item"><span class="leg-dot" style="background:#2E7D32"></span>Active</span>
          <span class="leg-item"><span class="leg-dot" style="background:#C62828"></span>Inactive</span>
        </div>
        <div style="position:relative;height:200px"><canvas id="c_active" role="img" aria-label="Bar chart comparing churn rate of active vs inactive members">Churn rates by activity status.</canvas></div>
      </div>
      <div class="chart-card">
        <h3>Churn rate by geography</h3>
        <div style="position:relative;height:220px"><canvas id="c_geo" role="img" aria-label="Bar chart of churn rate by country">Churn by geography.</canvas></div>
      </div>
      <div class="chart-card">
        <h3>Age distribution</h3>
        <div class="legend">
          <span class="leg-item"><span class="leg-dot" style="background:#2E7D32"></span>Retained</span>
          <span class="leg-item"><span class="leg-dot" style="background:#C62828;opacity:.7"></span>Churned</span>
        </div>
        <div style="position:relative;height:200px"><canvas id="c_age" role="img" aria-label="Histogram showing age distribution of churned vs retained customers">Age distribution.</canvas></div>
      </div>
      <div class="chart-card">
        <h3>Balance distribution</h3>
        <div class="legend">
          <span class="leg-item"><span class="leg-dot" style="background:#1565C0"></span>Retained</span>
          <span class="leg-item"><span class="leg-dot" style="background:#E65100;opacity:.7"></span>Churned</span>
        </div>
        <div style="position:relative;height:200px"><canvas id="c_bal" role="img" aria-label="Balance bucket comparison churned vs retained">Balance distribution.</canvas></div>
      </div>
    </div>
    <div class="insights">
      <div class="insight red"><p><strong>Inactive members</strong> churn at 2.6× the rate of active ones — engagement is the #1 predictor of retention.</p></div>
      <div class="insight orange"><p><strong>Germany</strong> has the highest churn rate (23%) vs France (14%) — geography matters for retention strategy.</p></div>
      <div class="insight blue"><p><strong>Ages 40–55</strong> are overrepresented in churn — mid-career customers may seek better deals elsewhere.</p></div>
      <div class="insight green"><p><strong>Zero-balance customers</strong> churn more — account balance is a proxy for financial commitment.</p></div>
    </div>`;
  document.getElementById('tabContent').innerHTML = html;
  setTimeout(()=>{
    const act = data.filter(d=>d.active===1), inact = data.filter(d=>d.active===0);
    destroyChart('active');
    charts['active'] = new Chart(document.getElementById('c_active'),{type:'bar',data:{labels:['Active','Inactive'],datasets:[{data:[(churnRate(act)*100).toFixed(1),(churnRate(inact)*100).toFixed(1)],backgroundColor:['#2E7D32','#C62828'],borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}});
    const geos = ['France','Germany','Spain'];
    const geoCR = geos.map(g=>+(churnRate(data.filter(d=>d.geo===g))*100).toFixed(1));
    destroyChart('geo');
    charts['geo'] = new Chart(document.getElementById('c_geo'),{type:'bar',data:{labels:geos,datasets:[{data:geoCR,backgroundColor:['#1565C0','#C62828','#E65100'],borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}});
    const ageBuckets=[{l:'18-29',min:18,max:29},{l:'30-39',min:30,max:39},{l:'40-49',min:40,max:49},{l:'50-59',min:50,max:59},{l:'60+',min:60,max:99}];
    destroyChart('age');
    charts['age'] = new Chart(document.getElementById('c_age'),{type:'bar',data:{labels:ageBuckets.map(b=>b.l),datasets:[{label:'Retained',data:ageBuckets.map(b=>data.filter(d=>d.age>=b.min&&d.age<=b.max&&d.exited===0).length),backgroundColor:'#2E7D32',borderRadius:4},{label:'Churned',data:ageBuckets.map(b=>data.filter(d=>d.age>=b.min&&d.age<=b.max&&d.exited===1).length),backgroundColor:'rgba(198,40,40,0.7)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:false},y:{beginAtZero:true}}}});
    const balBuckets=[{l:'€0',min:0,max:0.1},{l:'€1-50k',min:1,max:50000},{l:'€50-100k',min:50001,max:100000},{l:'€100k+',min:100001,max:1e9}];
    destroyChart('bal');
    charts['bal'] = new Chart(document.getElementById('c_bal'),{type:'bar',data:{labels:balBuckets.map(b=>b.l),datasets:[{label:'Retained',data:balBuckets.map(b=>data.filter(d=>d.bal>=b.min&&d.bal<=b.max&&d.exited===0).length),backgroundColor:'#1565C0',borderRadius:4},{label:'Churned',data:balBuckets.map(b=>data.filter(d=>d.bal>=b.min&&d.bal<=b.max&&d.exited===1).length),backgroundColor:'rgba(230,81,0,0.7)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  },50);
}

function renderProducts(data){
  const pGroups=[1,2,3,4];
  const doc = `
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Churn rate by product count</h3>
        <div style="position:relative;height:220px"><canvas id="c_prod" role="img" aria-label="Bar chart showing churn rate by number of products held">Product count churn.</canvas></div>
      </div>
      <div class="chart-card">
        <h3>Customer count by products</h3>
        <div style="position:relative;height:220px"><canvas id="c_prodcount" role="img" aria-label="Bar chart of how many customers hold each number of products">Product distribution.</canvas></div>
      </div>
      <div class="chart-card" style="grid-column:1/-1">
        <h3>Single vs multi-product churn — engagement cross-analysis</h3>
        <div style="position:relative;height:200px"><canvas id="c_crosspp" role="img" aria-label="Grouped bar chart comparing churn of single vs multi product customers by activity">Cross analysis.</canvas></div>
      </div>
    </div>
    <div class="insights">
      <div class="insight green"><p><strong>2-product customers</strong> churn significantly less than 1-product customers — cross-selling is the single highest-ROI retention lever.</p></div>
      <div class="insight red"><p><strong>3-4 product customers</strong> churn at high rates — this signals a product-market fit issue for bundled products, not a loyalty problem.</p></div>
      <div class="insight blue"><p><strong>Active 2-product customers</strong> represent the "sweet spot" — highest retention, highest lifetime value.</p></div>
    </div>`;
  document.getElementById('tabContent').innerHTML = doc;
  setTimeout(()=>{
    const prodCR = pGroups.map(p=>+(churnRate(data.filter(d=>d.prods===p))*100).toFixed(1));
    const prodColors = ['#2E7D32','#1565C0','#C62828','#E65100'];
    destroyChart('prod');
    charts['prod'] = new Chart(document.getElementById('c_prod'),{type:'bar',data:{labels:['1 product','2 products','3 products','4 products'],datasets:[{data:prodCR,backgroundColor:prodColors,borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}});
    destroyChart('prodcount');
    charts['prodcount'] = new Chart(document.getElementById('c_prodcount'),{type:'bar',data:{labels:['1 product','2 products','3 products','4 products'],datasets:[{data:pGroups.map(p=>data.filter(d=>d.prods===p).length),backgroundColor:prodColors.map(c=>c+'99'),borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    const crossLabels=['Active 1-prod','Active 2-prod','Inactive 1-prod','Inactive 2-prod'];
    const crossData=[churnRate(data.filter(d=>d.active===1&&d.prods===1)),churnRate(data.filter(d=>d.active===1&&d.prods===2)),churnRate(data.filter(d=>d.active===0&&d.prods===1)),churnRate(data.filter(d=>d.active===0&&d.prods===2))].map(v=>+(v*100).toFixed(1));
    destroyChart('crosspp');
    charts['crosspp'] = new Chart(document.getElementById('c_crosspp'),{type:'bar',data:{labels:crossLabels,datasets:[{data:crossData,backgroundColor:['#1565C0','#2E7D32','#C62828','#E65100'],borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}});
  },50);
}

function renderProfiles(data){
  const profiles=['Active Engaged','Active Low-Product','Inactive High-Balance','Inactive Disengaged'];
  const maxCR = Math.max(...profiles.map(p=>churnRate(data.filter(d=>d.profile===p))));
  const rows = profiles.map(p=>{
    const sub = data.filter(d=>d.profile===p);
    const cr = churnRate(sub);
    const pct = maxCR>0?(cr/maxCR*100).toFixed(0):0;
    const col = profileColors[p];
    return `<div class="prof-row">
      <div class="prof-label">${p}</div>
      <div class="prof-bar-wrap" style="position:relative">
        <div class="prof-bar" style="width:${pct}%;background:${col};color:white">${(cr*100).toFixed(1)}%</div>
      </div>
      <span style="font-size:11px;color:var(--color-text-secondary);min-width:60px;text-align:right">${sub.length.toLocaleString()} cust.</span>
    </div>`;
  }).join('');
  const html = `
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Churn rate by engagement profile</h3>
        <div class="profile-bars" style="margin-top:8px">${rows}</div>
      </div>
      <div class="chart-card">
        <h3>Profile distribution</h3>
        <div style="position:relative;height:200px"><canvas id="c_pie" role="img" aria-label="Pie chart showing distribution of customers across engagement profiles">Profile distribution.</canvas></div>
      </div>
      <div class="chart-card" style="grid-column:1/-1">
        <h3>RSI (relationship strength index) distribution</h3>
        <div class="legend">
          <span class="leg-item"><span class="leg-dot" style="background:#2E7D32"></span>Retained</span>
          <span class="leg-item"><span class="leg-dot" style="background:#C62828;opacity:.7"></span>Churned</span>
        </div>
        <div style="position:relative;height:180px"><canvas id="c_rsi" role="img" aria-label="Histogram of RSI scores for churned vs retained customers">RSI distribution.</canvas></div>
      </div>
    </div>`;
  document.getElementById('tabContent').innerHTML = html;
  setTimeout(()=>{
    const pieCounts = profiles.map(p=>data.filter(d=>d.profile===p).length);
    destroyChart('pie');
    charts['pie'] = new Chart(document.getElementById('c_pie'),{type:'doughnut',data:{labels:profiles,datasets:[{data:pieCounts,backgroundColor:profiles.map(p=>profileColors[p]),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
    const rsiBuckets=['0.0-0.2','0.2-0.4','0.4-0.6','0.6-0.8','0.8-1.0'];
    const getRSI = d=>d.active*0.4+(d.prods/4)*0.4+d.hcc*0.2;
    destroyChart('rsi');
    charts['rsi'] = new Chart(document.getElementById('c_rsi'),{type:'bar',data:{labels:rsiBuckets,datasets:[{label:'Retained',data:[0,0.2,0.4,0.6,0.8].map((lo,i)=>data.filter(d=>d.exited===0&&getRSI(d)>=lo&&getRSI(d)<lo+0.2).length),backgroundColor:'#2E7D32',borderRadius:4},{label:'Churned',data:[0,0.2,0.4,0.6,0.8].map((lo,i)=>data.filter(d=>d.exited===1&&getRSI(d)>=lo&&getRSI(d)<lo+0.2).length),backgroundColor:'rgba(198,40,40,0.7)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  },50);
}

function renderKPITab(data){
  const act = data.filter(d=>d.active===1), inact = data.filter(d=>d.active===0);
  const sp = data.filter(d=>d.prods===1), mp = data.filter(d=>d.prods===2);
  const hb = data.filter(d=>d.bal>60000);
  const hbD = hb.filter(d=>d.active===0&&d.exited===1);
  const cc = data.filter(d=>d.hcc===1), ncc = data.filter(d=>d.hcc===0);
  const sticky = data.filter(d=>d.active===1&&d.prods>=2&&d.hcc===1);
  const nonsticky = data.filter(d=>!(d.active===1&&d.prods>=2&&d.hcc===1));
  const kpis2 = [
    {name:'Engagement retention ratio',formula:'inactive churn ÷ active churn',val:(act.length&&inact.length)?(churnRate(inact)/churnRate(act)).toFixed(2)+'x':'–',desc:'How much more likely inactive members are to churn',color:'#C62828'},
    {name:'Product depth index',formula:'1-product churn ÷ 2-product churn',val:(sp.length&&mp.length)?(churnRate(sp)/churnRate(mp)).toFixed(2)+'x':'–',desc:'Retention benefit of holding an additional product',color:'#1565C0'},
    {name:'High-balance disengagement rate',formula:'inactive+churned among top 25% balance',val:hb.length?(hbD.length/hb.length*100).toFixed(1)+'%':'–',desc:'Percentage of premium customers silently at risk',color:'#E65100'},
    {name:'Credit card stickiness score',formula:'no-card churn ÷ card-holder churn',val:(cc.length&&ncc.length)?(churnRate(ncc)/churnRate(cc)).toFixed(2)+'x':'–',desc:'Marginal retention from credit card ownership',color:'#7B1FA2'},
    {name:'Relationship strength index',formula:'non-sticky churn ÷ sticky churn',val:(sticky.length&&nonsticky.length)?(churnRate(nonsticky)/churnRate(sticky)).toFixed(2)+'x':'–',desc:'Retention multiplier for fully-engaged customers',color:'#2E7D32'},
  ];
  const html = `
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem">
    ${kpis2.map(k=>`
      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:start">
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">${k.name}</div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px">Formula: ${k.formula}</div>
          <div style="font-size:11px;color:var(--color-text-secondary)">${k.desc}</div>
        </div>
        <div style="font-size:24px;font-weight:500;color:${k.color};text-align:right;min-width:60px">${k.val}</div>
      </div>`).join('')}
    </div>
    <button class="tab" style="font-size:13px;padding:8px 16px" onclick="sendPrompt('Based on the KPIs in the bank churn dashboard, give me 5 specific retention strategy recommendations with expected impact.')">Get AI recommendations based on these KPIs ↗</button>`;
  document.getElementById('tabContent').innerHTML = html;
}

function switchTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentTab = tab;
  Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k];});
  refresh();
}

function refresh(){
  const data = getFiltered();
  renderKPIs(data);
  if(currentTab==='overview') renderOverview(data);
  else if(currentTab==='products') renderProducts(data);
  else if(currentTab==='profiles') renderProfiles(data);
  else if(currentTab==='kpis') renderKPITab(data);
}

document.getElementById('profileFilter').addEventListener('change', refresh);
document.getElementById('geoFilter').addEventListener('change', refresh);
document.getElementById('activeFilter').addEventListener('change', refresh);
document.getElementById('prodFilter').addEventListener('input', function(){
  document.getElementById('prodVal').textContent = this.value;
  refresh();
});

refresh();
</script>
